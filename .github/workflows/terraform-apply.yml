name: Terraform - Apply Infraestructura

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribir APLICAR para confirmar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pm04-terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Aplicar infraestructura Azure
    if: github.ref == 'refs/heads/main' && inputs.confirmar == 'APLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticarse en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_TERRAFORM_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.2'

      - name: Cargar variables protegidas
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TF_VARS }}
        run: |
          if [ -z "$TFVARS_CONTENT" ]; then
            echo "::error::Falta el secreto TF_VARS"
            exit 1
          fi
          umask 077
          printf '%s\n' "$TFVARS_CONTENT" > terraform.tfvars

      - name: Inicializar estado remoto
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=rg-tudoapp-projetointegrador-state" \
            -backend-config="storage_account_name=tudoappprojetointegrador" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=todo/dev.terraform.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Validar configuracion
        run: terraform validate

      - name: Preparar plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=plan.bin

      - name: Bloquear eliminaciones y reemplazos
        shell: bash
        run: |
          if terraform show -json plan.bin |
             jq -e '[.resource_changes[]? |
               select(.change.actions | index("delete"))] |
               length == 0' > /dev/null; then
            echo "PM04_PLAN_SEGURO: no se eliminaran recursos"
          else
            echo "::error::Plan bloqueado: contiene eliminaciones o reemplazos"
            exit 1
          fi

      - name: Aplicar plan aprobado
        run: terraform apply -input=false -no-color plan.bin

      - name: Confirmar operacion
        run: echo "PM04_TERRAFORM_APPLY_OK"
