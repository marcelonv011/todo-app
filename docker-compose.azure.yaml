services:
  backend:
    build:
      context: ./backend
    container_name: todo-backend
    restart: unless-stopped
    env_file:
      - /opt/todo-app/backend.env
    expose:
      - "5000"
    networks:
      - todo-net

  frontend:
    build:
      context: ./frontend
    container_name: todo-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - todo-net

  caddy:
    image: caddy:2
    container_name: todo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
